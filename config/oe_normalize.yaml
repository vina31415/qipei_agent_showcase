# OE 归一化规则配置（ADR-15 v2 定稿）
# 规则落配置表，不硬编码

# 前缀清单（全部大写，按长度降序排列）
# 无标点后缀的前缀（OE/OEM/REF）匹配后必须紧跟非字母数字字符或字符串结尾
# 含标点前缀（REF.NO./NO./N°/OE#/OEM#）自带边界直接匹配
prefixes:
  - "REF.NO."
  - "OEM#"
  - "OEM"
  - "OE#"
  - "OE"
  - "REF"
  - "NO."
  - "N°"

# 分隔符集合（归一化时去除，只保留 [A-Z0-9]）
separators:
  - " "
  - "-"
  - "/"
  - "."
  - "_"
  - "#"
  - ":"
  - "°"

# 纯数字 OE 去前导零开关
strip_leading_zeros: true

# 宽松匹配开关（默认关闭，M1 不自动触发）
loose_match: false

# 无效 OE 标记规则：去前导零后为空串（如全 0 的 "000"）标记无效
invalid_on_empty: true
