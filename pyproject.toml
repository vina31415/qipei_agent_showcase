[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qipei-agent"
version = "0.1.0"
description = "B2B 汽配售后业务智能体 - 内部 OE/车型查询助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "volcengine>=1.0.130",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qipei_agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
