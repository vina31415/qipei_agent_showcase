# 变体样本（前缀/分隔符/前导零/大写）
variants:
  # 前缀变体
  - oe_raw: "REF.NO.123456"
    expected: "123456"
    is_valid: true
  - oe_raw: "OEM#123456"
    expected: "123456"
    is_valid: true
  - oe_raw: "OE#0986479012"
    expected: "986479012"
    is_valid: true
  - oe_raw: "REF 123456"
    expected: "123456"
    is_valid: true
  - oe_raw: "NO.123456"
    expected: "123456"
    is_valid: true
  - oe_raw: "N°123456"
    expected: "123456"
    is_valid: true
  # 分隔符变体
  - oe_raw: "1K0-615-301"
    expected: "1K0615301"
    is_valid: true
  - oe_raw: "1K0/615/301"
    expected: "1K0615301"
    is_valid: true
  - oe_raw: "1K0.615.301"
    expected: "1K0615301"
    is_valid: true
  - oe_raw: "1K0_615_301"
    expected: "1K0615301"
    is_valid: true
  - oe_raw: "0 986 479 012"
    expected: "986479012"
    is_valid: true
  # 前导零变体
  - oe_raw: "000"
    expected: null
    is_valid: false
  - oe_raw: "0"
    expected: null
    is_valid: false
  - oe_raw: "0000"
    expected: null
    is_valid: false
  # 大小写变体
  - oe_raw: "6q0820803c"
    expected: "6Q0820803C"
    is_valid: true
  - oe_raw: "Lr020365"
    expected: "LR020365"
    is_valid: true
  # 版本后缀差异
  - oe_raw: "6Q0820803C"
    expected: "6Q0820803C"
    is_valid: true
  - oe_raw: "6Q0820803"
    expected: "6Q0820803"
    is_valid: true
